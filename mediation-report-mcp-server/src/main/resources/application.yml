server:
  port: 10014

spring:
  application:
    name: mediation-report-mcp-server
  ai:
    mcp:
      server:
        name: mediation-report-mcp-server
        version: 1.0.0
        protocol: SSE
        instructions: |
          This MCP server provides query_mediation_report for mediation developer report querying.
          Always provide time range and at least one indicator.
          Default pageNo=1, pageSize=20, aggregateType=2 when user does not specify.
        type: SYNC
        sse-endpoint: /sse
        sse-message-endpoint: /mcp/message

app:
  backend:
    base-url: http://202.168.108.109:10013
    report-path: /mediation/report/sdk_developer_list_new
