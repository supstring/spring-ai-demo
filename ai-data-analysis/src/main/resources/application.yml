server:
  port: 8080

spring:
  application:
    name: ai-data-analysis

# ============ AI 配置 (Spring AI - DeepSeek) ============
# 用于数据分析和自然语言报告生成
# DeepSeek API 兼容 OpenAI 格式，使用自定义 base-url
spring.ai:
  openai:
    api-key: ${DEEPSEEK_API_KEY:sk-d9efc177c70e449ca3db031b0cc4ee70}
    base-url: https://api.deepseek.com
    chat:
      options:
        model: deepseek-chat
        temperature: 0.3

# ============ 应用 AI 多 Provider 路由配置 ============
# 支持不同 provider 使用不同 base-url / api-key / default-model
# 可选保留 default-model 与 model-aliases 作为兼容旧逻辑的兜底配置
app:
  ai:
    default-provider: deepseek
    providers:
      deepseek:
        base-url: https://api.deepseek.com
        api-key: ${DEEPSEEK_API_KEY:sk-d9efc177c70e449ca3db031b0cc4ee70}
        default-model: deepseek-chat
        model-aliases:
          chat: deepseek-chat
          reasoner: deepseek-reasoner
      # openai:
      #   base-url: https://api.openai.com
      #   api-key: ${OPENAI_API_KEY:}
      #   default-model: gpt-4o-mini
      # qwen:
      #   base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      #   api-key: ${QWEN_API_KEY:}
      #   default-model: qwen-plus
    default-model: deepseek-chat
    model-aliases:
      deepseek: deepseek-chat
      reasoner: deepseek-reasoner
  mcp:
    enabled: ${MCP_ENABLED:false}
    # STDIO 模式：指定 ClickHouse MCP 进程命令
    clickhouse:
      command: npx
      args: -y, @clickhouse/mcp-server
    # 或 HTTP/SSE 模式（若 MCP Server 暴露 HTTP 端点）
    # http-url: http://localhost:3000/mcp

# ============ ClickHouse 配置 ============
# 方式一：直接 JDBC 连接（当不使用 MCP 时）
clickhouse:
  url: jdbc:clickhouse://localhost:8123/default
  username: ${CLICKHOUSE_USER:default}
  password: ${CLICKHOUSE_PASSWORD:}

# ============ MCP 配置 ============
# 方式二：通过 MCP 调用 ClickHouse
# ClickHouse MCP Server 通常以 STDIO 或 HTTP 方式运行
# 若使用官方 mcp-clickhouse (Node.js)，需单独启动该进程

# ============ 麦当劳 MCP 配置 ============
# 文档：https://open.mcd.cn/mcp/doc
# 申请 Token：https://open.mcd.cn/mcp
mcd:
  mcp:
    # MCP 服务地址
    base-url: https://mcp.mcd.cn
    # MCP Token（从 https://open.mcd.cn/mcp 申请）
    token: ${MCD_MCP_TOKEN:n0JSIOHXJhbUvB0kDVvAvv3NS5m4E5Oz}
  api:
    # 开放平台 API 配置（用于直接调用 REST API）
    # 环境：UAT（测试）或 PROD（生产）
    env: ${MCD_API_ENV:PROD}
    # 应用 ID（由麦当劳提供）
    app-id: ${MCD_APP_ID:}
    # 商户 ID（由麦当劳提供）
    merchant-id: ${MCD_MERCHANT_ID:}
    # 签名密钥（由麦当劳提供）
    key: ${MCD_API_KEY:}
